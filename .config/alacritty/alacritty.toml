# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║                         GENTLEMAN DOTS - ALACRITTY                           ║
# ║                          Optimized for Neovim                                ║
# ╚══════════════════════════════════════════════════════════════════════════════╝


[general]
import = ["~/.config/alacritty/size.toml"]

# ┌──────────────────────────────────────────────────────────────────────────────┐
# │                                   FONT                                       │
# └──────────────────────────────────────────────────────────────────────────────┘

[font]
# Font size is managed by setup.sh via general.import + size.toml

[font.normal]
family = "IosevkaTerm NF"


# ┌──────────────────────────────────────────────────────────────────────────────┐
# │                                  WINDOW                                      │
# └──────────────────────────────────────────────────────────────────────────────┘

[window]
startup_mode = "Maximized"
opacity = 0.70
blur = true
option_as_alt = "Both"


# ┌──────────────────────────────────────────────────────────────────────────────┐
# │                                  CURSOR                                      │
# └──────────────────────────────────────────────────────────────────────────────┘

[cursor]
style = "Block"
blink_interval = 500
unfocused_hollow = true
vi_mode_style = "Block"


# ┌──────────────────────────────────────────────────────────────────────────────┐
# │                                 TERMINAL                                     │
# └──────────────────────────────────────────────────────────────────────────────┘

[terminal]
# For best Neovim compatibility, install alacritty terminfo:
# sudo tic -xe alacritty,alacritty-direct extra/alacritty.info

[env]
TERM = "xterm-256color"

[hints]
enabled = []


# ┌──────────────────────────────────────────────────────────────────────────────┐
# │                              SELECTION                                       │
# └──────────────────────────────────────────────────────────────────────────────┘

[selection]
save_to_clipboard = true
semantic_escape_chars = ",│`|:\"' ()[]{}<>\t"


# ┌──────────────────────────────────────────────────────────────────────────────┐
# │                                MOUSE                                         │
# └──────────────────────────────────────────────────────────────────────────────┘

[mouse]
hide_when_typing = true

[[mouse.bindings]]
mouse = "Middle"
action = "PasteSelection"


# ┌──────────────────────────────────────────────────────────────────────────────┐
# │                                SCROLLING                                     │
# └──────────────────────────────────────────────────────────────────────────────┘

[scrolling]
history = 10000
multiplier = 3


# ┌──────────────────────────────────────────────────────────────────────────────┐
# │                              KEYBINDINGS                                     │
# └──────────────────────────────────────────────────────────────────────────────┘

[[keyboard.bindings]]
key = "Paste"
action = "Paste"

[[keyboard.bindings]]
key = "Copy"
action = "Copy"

[[keyboard.bindings]]
key = "L"
mods = "Control"
action = "ClearLogNotice"

[[keyboard.bindings]]
key = "L"
mods = "Control"
mode = "~Vi"
chars = "\f"

[[keyboard.bindings]]
key = "PageUp"
mods = "Shift"
mode = "~Alt"
action = "ScrollPageUp"

[[keyboard.bindings]]
key = "PageDown"
mods = "Shift"
mode = "~Alt"
action = "ScrollPageDown"

[[keyboard.bindings]]
key = "Home"
mods = "Shift"
mode = "~Alt"
action = "ScrollToTop"

[[keyboard.bindings]]
key = "End"
mods = "Shift"
mode = "~Alt"
action = "ScrollToBottom"

[[keyboard.bindings]]
key = "V"
mods = "Control|Shift"
action = "Paste"

[[keyboard.bindings]]
key = "C"
mods = "Control|Shift"
action = "Copy"

[[keyboard.bindings]]
key = "F"
mods = "Control|Shift"
action = "SearchForward"

[[keyboard.bindings]]
key = "B"
mods = "Control|Shift"
action = "SearchBackward"

[[keyboard.bindings]]
key = "C"
mods = "Control|Shift"
mode = "Vi"
action = "ClearSelection"

[[keyboard.bindings]]
key = "Key0"
mods = "Control"
action = "ResetFontSize"


# ┌──────────────────────────────────────────────────────────────────────────────┐
# │                             GENERAL                                          │
# └──────────────────────────────────────────────────────────────────────────────┘

[general]
live_config_reload = true
working_directory = "None"


# ┌──────────────────────────────────────────────────────────────────────────────┐
# │                            KANAGAWA THEME                                    │
# └──────────────────────────────────────────────────────────────────────────────┘

# --- Base Colors ---
[colors.primary]
background = "#1F1F28"
foreground = "#DCD7BA"
dim_foreground = "#727169"
bright_foreground = "#DCD7BA"

[colors.cursor]
cursor = "#C8C093"
text = "#1F1F28"

[colors.selection]
background = "#2D4F67"
text = "#C8C093"

# --- Normal Colors ---
[colors.normal]
black   = "#090618"
red     = "#C34043"
green   = "#76946A"
yellow  = "#C0A36E"
blue    = "#7E9CD8"
magenta = "#957FB8"
cyan    = "#6A9589"
white   = "#C8C093"

# --- Bright Colors ---
[colors.bright]
black   = "#090618"
red     = "#E82424"
green   = "#98BB6C"
yellow  = "#E6C384"
blue    = "#7FB4CA"
magenta = "#957FB8"
cyan    = "#7AA89F"
white   = "#DCD7BA"
